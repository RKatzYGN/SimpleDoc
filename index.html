<!DOCTYPE html>
<html lang="he" dir="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Editor</title>
  <style>
    /* Reset environment to a blank canvas */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    /* Full-screen distraction-free editor */
    #editor {
      width: 100%;
      height: 100vh;
      padding: 3rem;
      border: none;
      outline: none;
      font-size: 1.25rem;
      line-height: 1.6;
      color: #111111;
      overflow-y: auto;
    }
    /* Placeholder behavior when empty */
    #editor:empty:before {
      content: "Start typing in English or Hebrew...";
      color: #999999;
      pointer-events: none;
    }
  </style>
</head>
<body>
<!-- Floating Save Button -->
<button onclick="saveToCloud()" style="position: fixed; top: 1rem; right: 1rem; padding: 0.5rem 1rem; cursor: pointer;">
  Save
</button>

  <!-- Writing Area with Auto Text Direction -->
  <div id="editor" contenteditable="true" dir="auto" spellcheck="true"></div>

  <script>
    const editor = document.getElementById('editor');

    // 1. Load locally cached text immediately
    const localData = localStorage.getItem('kiosk_doc_content');
    if (localData) {
      editor.innerHTML = localData;
    }

    // 2. Real-time Save Handler
    let saveTimeout;
    editor.addEventListener('input', () => {
      // Save locally
      localStorage.setItem('kiosk_doc_content', editor.innerHTML);

      // Debounce saving to cloud endpoint (saves 1 sec after user stops typing)
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveToCloud, 1000);
    });

    // 3. Cloud Storage Sync
    async function saveToCloud() {
      const payload = { content: editor.innerHTML, updatedAt: new Date() };

      // Replace YOUR_API_ENDPOINT with your JSONBin, Firebase, or cloud URL

        await fetch('YOUR_API_ENDPOINT', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Cloud save failed, retained locally.", err);
      }
      */
    }
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault(); // Prevents the browser's default download dialog
    saveToCloud();
    alert('Document saved!');
  }
});
  </script>
</body>
</html>
