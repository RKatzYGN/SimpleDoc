<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // --- SUPABASE CONFIGURATION ---
  const SUPABASE_URL = 'https://vrlksitffjyramoqxxeq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZybGtzaXRmZmp5cmFtb3F4eGVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwOTg3ODYsImV4cCI6MjEwMzY3NDc4Nn0.ZCsFV5tQy2tf4r1Rk9CV7xKlyebfZCtg7SQDvJHF3gY';
  
  // Renamed variable to avoid name collisions
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let documents = [];
  let currentDocId = null;
  let saveTimeout = null;

  const editor = document.getElementById('editor');
  const titleInput = document.getElementById('doc-title');
  const statusEl = document.getElementById('status');
  const docListEl = document.getElementById('doc-list');

  function toggleDrawer() {
    document.getElementById('drawer').classList.toggle('open');
  }

  // 1. Fetch document list on boot
  async function fetchDocuments() {
    statusEl.innerText = 'Loading...';
    const { data, error } = await supabaseClient
      .from('documents')
      .select('id, title, content')
      .order('updated_at', { ascending: false });

    if (error) {
      console.error(error);
      statusEl.innerText = 'Error loading docs';
      return;
    }

    documents = data || [];

    if (documents.length === 0) {
      await createNewDoc();
    } else {
      renderDocList();
      selectDocument(documents[0].id);
    }
  }

  // 2. Select & Load Document
  function selectDocument(id) {
    currentDocId = id;
    const doc = documents.find(d => d.id === id);
    if (!doc) return;

    titleInput.value = doc.title;
    editor.innerHTML = doc.content || '';
    renderDocList();
    statusEl.innerText = 'Saved';
  }

  // 3. Render Drawer List
  function renderDocList() {
    docListEl.innerHTML = '';
    documents.forEach(doc => {
      const li = document.createElement('li');
      if (doc.id === currentDocId) li.classList.add('active');
      
      const span = document.createElement('span');
      span.innerText = doc.title || 'Untitled';
      span.onclick = () => { selectDocument(doc.id); toggleDrawer(); };

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.innerText = '✕';
      del.onclick = (e) => { e.stopPropagation(); deleteDoc(doc.id); };

      li.appendChild(span);
      li.appendChild(del);
      docListEl.appendChild(li);
    });
  }

  // 4. Create New Document
  async function createNewDoc() {
    statusEl.innerText = 'Creating...';
    const { data, error } = await supabaseClient
      .from('documents')
      .insert([{ title: 'Untitled Document', content: '' }])
      .select()
      .single();

    if (data && !error) {
      documents.unshift(data);
      renderDocList();
      selectDocument(data.id);
    }
  }

  // 5. Delete Document
  async function deleteDoc(id) {
    if (!confirm('Delete this document?')) return;

    await supabaseClient.from('documents').delete().eq('id', id);
    documents = documents.filter(d => d.id !== id);

    if (documents.length === 0) {
      await createNewDoc();
    } else {
      selectDocument(documents[0].id);
    }
  }

  // 6. Handle Typing & Auto-saving
  editor.addEventListener('input', triggerSave);
  function handleTitleChange() { triggerSave(); }

  function triggerSave() {
    statusEl.innerText = 'Saving...';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveToCloud, 1000);
  }

  async function saveToCloud() {
    if (!currentDocId) return;

    const title = titleInput.value;
    const content = editor.innerHTML;

    // Update local memory state
    const localDoc = documents.find(d => d.id === currentDocId);
    if (localDoc) {
      localDoc.title = title;
      localDoc.content = content;
      renderDocList();
    }

    // Push update to Supabase
    const { error } = await supabaseClient
      .from('documents')
      .update({ title, content, updated_at: new Date() })
      .eq('id', currentDocId);

    if (!error) {
      statusEl.innerText = 'Saved';
    } else {
      statusEl.innerText = 'Save Error';
    }
  }

  // Initialize App
  fetchDocuments();
</script>
