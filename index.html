<!DOCTYPE html>
<html lang="he" dir="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #fff; }
    
    /* Minimal Header Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: #f9f9f9;
      border-bottom: 1px solid #eee;
    }
    .header-left { display: flex; align-items: center; gap: 0.75rem; }
    button { cursor: pointer; padding: 0.4rem 0.8rem; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-size: 0.9rem; }
    button:hover { background: #f0f0f0; }
    #doc-title { font-size: 1rem; border: none; background: transparent; font-weight: bold; outline: none; }
    #status { font-size: 0.8rem; color: #888; }

    /* Document Drawer (Collapsible) */
    #drawer {
      position: fixed; top: 0; left: 0; width: 280px; height: 100%;
      background: #fafafa; border-right: 1px solid #ddd; padding: 1.5rem;
      transform: translateX(-100%); transition: transform 0.2s ease; z-index: 100;
      display: flex; flex-direction: column; gap: 1rem;
    }
    #drawer.open { transform: translateX(0); }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; }
    #doc-list { list-style: none; overflow-y: auto; flex-grow: 1; }
    #doc-list li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.6rem; margin-bottom: 0.25rem; border-radius: 4px; cursor: pointer;
    }
    #doc-list li:hover { background: #eee; }
    #doc-list li.active { background: #e0e0e0; font-weight: bold; }
    .del-btn { border: none; background: transparent; color: #c00; font-size: 0.8rem; padding: 0 0.4rem; }

    /* Fullscreen Editor */
    #editor {
      width: 100%; height: calc(100vh - 50px); padding: 3rem;
      border: none; outline: none; font-size: 1.25rem; line-height: 1.6; color: #111; overflow-y: auto;
    }
    #editor:empty:before { content: "Start typing in English or Hebrew..."; color: #999; pointer-events: none; }
  </style>
</head>
<body>

  <!-- Top Control Bar -->
  <header>
    <div class="header-left">
      <button onclick="toggleDrawer()">📁 Docs</button>
      <input type="text" id="doc-title" value="Loading..." oninput="handleTitleChange()" dir="auto" />
    </div>
    <span id="status">Ready</span>
  </header>

  <!-- Documents Drawer -->
  <div id="drawer">
    <div class="drawer-header">
      <h3>Documents</h3>
      <button onclick="toggleDrawer()">✕</button>
    </div>
    <button onclick="createNewDoc()">+ New Document</button>
    <ul id="doc-list"></ul>
  </div>

  <!-- Editor Area -->
  <div id="editor" contenteditable="true" dir="auto" spellcheck="true"></div>

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://vrlksitffjyramoqxxeq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZybGtzaXRmZmp5cmFtb3F4eGVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwOTg3ODYsImV4cCI6MjEwMzY3NDc4Nn0.ZCsFV5tQy2tf4r1Rk9CV7xKlyebfZCtg7SQDvJHF3gY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let documents = [];
    let currentDocId = null;
    let saveTimeout = null;

    const editor = document.getElementById('editor');
    const titleInput = document.getElementById('doc-title');
    const statusEl = document.getElementById('status');
    const docListEl = document.getElementById('doc-list');

    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
    }

    // 1. Fetch document list on boot
    async function fetchDocuments() {
      statusEl.innerText = 'Loading...';
      const { data, error } = await supabase
        .from('documents')
        .select('id, title, content')
        .order('updated_at', { ascending: false });

      if (error) {
        statusEl.innerText = 'Error loading docs';
        return;
      }

      documents = data || [];

      if (documents.length === 0) {
        await createNewDoc();
      } else {
        renderDocList();
        selectDocument(documents[0].id);
      }
    }

    // 2. Select & Load Document
    function selectDocument(id) {
      currentDocId = id;
      const doc = documents.find(d => d.id === id);
      if (!doc) return;

      titleInput.value = doc.title;
      editor.innerHTML = doc.content || '';
      renderDocList();
      statusEl.innerText = 'Saved';
    }

    // 3. Render Drawer List
    function renderDocList() {
      docListEl.innerHTML = '';
      documents.forEach(doc => {
        const li = document.createElement('li');
        if (doc.id === currentDocId) li.classList.add('active');
        
        const span = document.createElement('span');
        span.innerText = doc.title || 'Untitled';
        span.onclick = () => { selectDocument(doc.id); toggleDrawer(); };

        const del = document.createElement('button');
        del.className = 'del-btn';
        del.innerText = '✕';
        del.onclick = (e) => { e.stopPropagation(); deleteDoc(doc.id); };

        li.appendChild(span);
        li.appendChild(del);
        docListEl.appendChild(li);
      });
    }

    // 4. Create New Document
    async function createNewDoc() {
      statusEl.innerText = 'Creating...';
      const { data, error } = await supabase
        .from('documents')
        .insert([{ title: 'Untitled Document', content: '' }])
        .select()
        .single();

      if (data && !error) {
        documents.unshift(data);
        renderDocList();
        selectDocument(data.id);
      }
    }

    // 5. Delete Document
    async function deleteDoc(id) {
      if (!confirm('Delete this document?')) return;

      await supabase.from('documents').delete().eq('id', id);
      documents = documents.filter(d => d.id !== id);

      if (documents.length === 0) {
        await createNewDoc();
      } else {
        selectDocument(documents[0].id);
      }
    }

    // 6. Handle Typing & Auto-saving
    editor.addEventListener('input', triggerSave);
    function handleTitleChange() { triggerSave(); }

    function triggerSave() {
      statusEl.innerText = 'Saving...';
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveToCloud, 1000);
    }

    async function saveToCloud() {
      if (!currentDocId) return;

      const title = titleInput.value;
      const content = editor.innerHTML;

      // Update local memory state
      const localDoc = documents.find(d => d.id === currentDocId);
      if (localDoc) {
        localDoc.title = title;
        localDoc.content = content;
        renderDocList();
      }

      // Push update to Supabase
      const { error } = await supabase
        .from('documents')
        .update({ title, content, updated_at: new Date() })
        .eq('id', currentDocId);

      if (!error) {
        statusEl.innerText = 'Saved';
      } else {
        statusEl.innerText = 'Save Error';
      }
    }

    // Initialize App
    fetchDocuments();
  </script>
</body>
</html>
